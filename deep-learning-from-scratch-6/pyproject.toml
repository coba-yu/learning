[project]
name = "deep-learning-from-scratch-6"
version = "0.1.0"
description = "ゼロから作る Deep Learning 6 —LLM編 の学習用リポジトリ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.5.0",
    "numpy>=2.1.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "regex>=2023.0.0",
    "wandb>=0.16.0",
    "codebot",
]

[project.optional-dependencies]
full = [
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["codebot"]

[tool.uv.sources]
codebot = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 119

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
]
ignore = [
    "E741", # 数式由来の l / I / O などの変数名を許容
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
